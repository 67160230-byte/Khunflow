# KhumFlow — Docker Compose (Production)
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    restart: always
    networks:
      - khumflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://khumflow:${DB_PASSWORD}@postgres:5432/khumflow
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - khumflow-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=khumflow
      - POSTGRES_USER=khumflow
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khumflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - khumflow-network

networks:
  khumflow-network:
    driver: bridge

volumes:
  postgres_data:
